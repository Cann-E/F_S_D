<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>

    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="rubix cube">
        <p>Rubix Cube</p>
        <p>Price 19.99 $</p>
        </section>
    
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Card Holder Name</label>
            <input type="text" id="card-name" name="card-name" required aria-required="true"/>
            <div>
            <label for="card-number">Card Number:</label>
            <input type="number" id="card-number" name="card-number" required aria-required="true"/>
            </div>

            <label for="expiry-date">Expiry Date</label>
            <input type="number" id="expiry-date" name="expiry-date" required aria-required="true"/>
            <div>

            <label for="cvv">CVV</label>
            <input type="number" id="cvv" name="cvv" required aria-required="true"/>
            </div>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            </form>
        </section>

</body>

</html>
