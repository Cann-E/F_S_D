

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Cans MultiMedia Player</h1>

  <section>
    <h2>Lithihum Is Now Playing</h2>
    <audio controls aria-label="Cans Music Player">
      <source src="sample.mp4" type="audio" />
      </audio>      
    </section>

    <section>
      <h2>Cans Video Player</h2>
      <video controls aria-label="Cans Video Player" width="640" height="360">
        <source src="sample_video.mp4" type="video" />
        <track src="captions.vtt" kind="captions" srclang="en" label="English captions"/>
        </video>
      </section>

    <section>
      <h2>Transcript</h2>
      <p>Explaining what the video talks about the info of the video so a user can read insead of hearing</p>
      </section>

</body>

</html>
